<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>UpnLibX</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="Logo" class="brand-icon" />
      <img src="icons/logo-text.png" alt="UpnLibX" class="brand-text" />
    </div>
    <div id="network-badge" class="status-badge">
      <span class="dot"></span>
      <span id="network-text">Mengecek...</span>
    </div>
  </header>

  <main class="container">
    <!-- Active Tab Detection Card -->
    <div id="active-tab-card" class="section-card active-doc" style="display: none;">
      <div class="section-title">
        <span>Dokumen Terdeteksi di Tab Ini</span>
      </div>
      <div id="active-doc-title" class="doc-filename">Dokumen-UPN.pdf</div>
      <div id="active-doc-meta" class="doc-meta">0 halaman unik</div>
      <button id="btn-extract-tab" class="btn-primary">
        Unduh PDF dari Tab Ini
      </button>
    </div>

    <!-- Manual URL Input Card -->
    <div class="section-card">
      <div class="section-title">
        <span>Ekstrak via Link URL OPAC</span>
      </div>
      <p style="font-size: 11px; color: #94a3b8;">
        Tempel link halaman &quot;Open File&quot; (<code style="color:#cbd5e1;">192.168.36.203</code>):
      </p>
      <div class="input-group">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="http://192.168.36.203/libsys_digit_upnvyk/..."
        />
        <button id="btn-paste" class="btn-secondary" title="Paste dari Clipboard">
          Paste
        </button>
      </div>
      <button id="btn-extract-url" class="btn-primary">
        Unduh PDF
      </button>

      <!-- Progress Bar -->
      <div id="progress-box" class="progress-box">
        <div id="progress-label" class="progress-label">Memproses...</div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <!-- Status / Error Message -->
      <div id="message-box" class="message-box"></div>
    </div>
  </main>

  <footer class="footer">
    <span>UpnLibX v1.0 &bull; Chrome &amp; Firefox</span>
    <span>A4 Auto-Deduplicate</span>
  </footer>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
